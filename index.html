<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Tarot Divination ✨</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg-dark: #1a0a2e;
            --color-bg-panel: #1e1040;
            --color-gold: #d4a853;
            --color-white: #f0e6ff;
            --font-title: 'Cinzel Decorative', 'Noto Serif SC', 'Georgia', 'Songti SC', 'SimSun', serif;
            --font-body: 'Noto Serif SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --glass-bg: rgba(30, 16, 64, 0.6);
            --glass-border: rgba(212, 168, 83, 0.3);
            --glow-shadow: 0 0 15px rgba(212, 168, 83, 0.4);
            --transition-smooth: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --transition-bounce: all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --transition-fast: all 0.2s ease;
            --danger: #e05555;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at center, var(--color-bg-panel) 0%, var(--color-bg-dark) 100%);
            background-color: var(--color-bg-dark);
            color: var(--color-white);
            font-family: var(--font-body);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Canvas Background */
        #starCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }

        /* App Container */
        #app {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        /* Title */
        h1.main-title {
            font-family: var(--font-title);
            color: var(--color-gold);
            font-size: 2.5rem;
            margin-top: 2rem;
            text-shadow: 0 0 10px var(--color-gold), 0 0 20px rgba(212, 168, 83, 0.5), 0 0 30px rgba(212, 168, 83, 0.3);
            opacity: 0;
            transform: translateY(-20px);
            animation: fadeInDown 2s forwards 0.5s;
        }

        @keyframes fadeInDown {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Common Glass Panel */
        .glass-panel {
            position: relative;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .corner-symbol {
            position: absolute;
            color: rgba(212, 168, 83, 0.5);
            font-size: 16px;
            line-height: 1;
            pointer-events: none;
            user-select: none;
            z-index: 5;
        }

        .corner-symbol.top-left { top: 12px; left: 14px; }
        .corner-symbol.top-right { top: 12px; right: 14px; }
        .corner-symbol.bottom-left { bottom: 12px; left: 14px; }
        .corner-symbol.bottom-right { bottom: 12px; right: 14px; }

        /* Mystic Symbols Background */
        #mysticSymbols {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }

        .mystic-symbol {
            position: absolute;
            color: rgba(212, 168, 83, 0.15);
            font-family: var(--font-title);
            will-change: transform;
        }

        /* Buttons */
        .btn {
            background: rgba(30, 16, 64, 0.6);
            border: 2px solid transparent;
            background-image: linear-gradient(var(--color-bg-panel), var(--color-bg-panel)), linear-gradient(90deg, var(--color-gold), var(--color-white));
            background-origin: border-box;
            background-clip: padding-box, border-box;
            color: var(--color-gold);
            padding: 10px 20px;
            border-radius: 20px;
            font-family: var(--font-title);
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition-smooth);
            outline: none;
            position: relative;
            overflow: hidden;
        }
        
        .btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(212, 168, 83, 0.6), transparent);
            transform: skewX(-20deg);
            transition: 0s;
        }

        .btn:hover {
            box-shadow: var(--glow-shadow);
            transform: scale(1.05);
            background-image: linear-gradient(var(--color-bg-panel), var(--color-bg-panel)), linear-gradient(90deg, var(--color-white), var(--color-gold));
            color: var(--color-white);
        }
        
        .btn:hover::after {
            animation: btnScan 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes btnScan {
            0% { left: -100%; }
            100% { left: 200%; }
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Settings Button */
        #settingsBtn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: var(--color-gold);
            font-size: 24px;
            cursor: pointer;
            z-index: 100;
            transition: var(--transition-smooth);
        }

        #settingsBtn:hover {
            transform: rotate(90deg) scale(1.1);
            text-shadow: var(--glow-shadow);
        }

        /* Settings Panel */
        #settingsPanel {
            position: fixed;
            top: 0;
            right: -350px;
            width: 320px;
            height: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-left: 1px solid var(--glass-border);
            z-index: 99;
            transition: right 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 80px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        #settingsPanel.open {
            right: 0;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setting-group label {
            font-size: 0.9rem;
            color: var(--color-gold);
        }

        .setting-group input[type="text"],
        .setting-group input[type="password"] {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--color-white);
            padding: 8px;
            border-radius: 4px;
            outline: none;
        }

        .setting-group input[type="range"] {
            accent-color: var(--color-gold);
        }

        /* Music Player */
        #musicBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--color-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            transition: var(--transition-smooth);
            font-size: 20px;
        }

        #musicBtn:hover {
            box-shadow: var(--glow-shadow);
        }

        .playing-waves {
            display: none;
            width: 20px;
            height: 20px;
            justify-content: space-between;
            align-items: flex-end;
        }

        .playing-waves .wave {
            width: 4px;
            background-color: var(--color-gold);
            animation: bounce 1s infinite ease-in-out;
            border-radius: 2px;
        }

        .wave:nth-child(1) { height: 30%; animation-delay: 0s; }
        .wave:nth-child(2) { height: 100%; animation-delay: 0.2s; }
        .wave:nth-child(3) { height: 60%; animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 100% { height: 30%; }
            50% { height: 100%; }
        }

        #musicBtn.playing .icon { display: none; }
        #musicBtn.playing .playing-waves { display: flex; }

        /* Spread Cards */
        .spread-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 900px;
            margin-top: 40px;
        }

        .spread-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            width: 260px;
            cursor: pointer;
            transition: var(--transition-bounce);
            opacity: 0;
            transform: translateY(30px);
        }

        .spread-card:hover {
            border-color: #6a5aaa;
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .spread-card.selected {
            border-color: var(--color-gold) !important;
            box-shadow: 0 0 30px rgba(212, 168, 83, 0.5) !important;
            transform: translateY(-4px);
            background: rgba(30, 16, 64, 0.9);
        }

        .spread-title {
            color: var(--color-gold);
            font-family: var(--font-title);
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .spread-desc {
            font-size: 0.9rem;
            color: rgba(240, 230, 255, 0.8);
            line-height: 1.5;
        }

        /* Inputs */
        .fancy-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(212, 168, 83, 0.5);
            color: var(--color-white);
            font-family: var(--font-title);
            font-size: 1.5rem;
            padding: 10px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            outline: none;
            transition: var(--transition-smooth);
            margin-bottom: 20px;
        }

        .fancy-input:focus {
            border-bottom-color: var(--color-gold);
            box-shadow: 0 10px 10px -10px var(--color-gold);
        }

        .fancy-input::placeholder {
            color: rgba(240, 230, 255, 0.3);
        }

        .number-input {
            width: 62px !important;
            height: 62px;
            max-width: 62px;
            border-radius: 14px;
            border: 2px solid rgba(212, 168, 83, 0.3) !important;
            background: rgba(10, 8, 30, 0.7);
            color: var(--color-gold);
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            font-family: var(--font-title);
            transition: var(--transition-fast);
            outline: none;
            margin-bottom: 0;
            -webkit-appearance: none;
            -moz-appearance: textfield;
        }
        .number-input::-webkit-inner-spin-button,
        .number-input::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .number-input:focus {
            border-color: var(--color-gold) !important;
            box-shadow: 0 0 20px rgba(212, 168, 83, 0.4);
            background: rgba(20, 14, 50, 0.9);
            border-bottom: 2px solid var(--color-gold) !important;
        }
        .number-input.error {
            border-color: var(--danger) !important;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        #inputError {
            color: var(--danger);
            text-align: center;
            font-size: 0.85rem;
            min-height: 22px;
            margin-top: 12px;
        }

        #confirmNumberBtn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            pointer-events: none;
        }

        #confirmSpreadBtn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            pointer-events: none;
        }

        .meditation-box {
            max-width: 600px;
            text-align: center;
            line-height: 1.8;
            font-size: 1.2rem;
            margin-bottom: 40px;
            min-height: 150px;
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            transition: all 0.8s ease-out;
        }
        
        .meditation-box.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .inputs-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 800px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .input-group label {
            color: var(--color-gold);
            font-size: 0.9rem;
        }

        /* Fan Deck */
        #fan-container {
            position: fixed;
            top: 92%;
            left: 50%;
            width: 0;
            height: 0;
            perspective: 1000px;
            z-index: 20;
            transform: translateY(100vh);
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none; /* Let children handle pointer events */
        }

        #fan-container.visible {
            transform: translateY(0);
        }

        .fan-card {
            position: absolute;
            width: 150px;
            height: 236px;
            margin-left: -75px; /* Center horizontally */
            margin-top: -236px; /* Anchor at bottom */
            transform-origin: 50% 100%;
            will-change: transform, opacity;
            transform-style: preserve-3d;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6), 0 0 20px rgba(212, 168, 83, 0.2);
            pointer-events: auto;
            cursor: grab;
            user-select: none;
            -webkit-user-drag: none;
        }

        .fan-card:active {
            cursor: grabbing;
        }

        .fan-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.8s;
            transform-style: preserve-3d;
        }

        .fan-card.flipped .fan-card-inner {
            /* Let JS handle the flip completely so it can include rotateZ for reversed cards */
        }

        .fan-card-front, .fan-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            background-color: #2a1b40;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--color-gold);
        }

        .fan-card-back {
            /* Card back pattern */
            background: linear-gradient(135deg, rgba(212,168,83,0.2), rgba(240,230,255,0.1)), url('graph/背面牌.jpg');
            background-size: cover;
            background-position: center;
            border: 2px solid var(--color-gold);
        }
        
        .fan-card-back::after {
            content: '✨';
            font-size: 40px;
            opacity: 0.5;
            text-shadow: 0 0 10px var(--color-gold);
        }

        .fan-card-front {
            background: #fff;
            transform: rotateY(180deg);
            color: #000;
            flex-direction: column;
            text-align: center;
            padding: 10px;
        }

        .fan-card-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            opacity: 0.2; /* Fallback if image fails to load properly, keep it faint so text is visible, or we just rely on text */
        }
        
        .card-name-overlay {
            position: relative;
            z-index: 2;
            font-family: var(--font-title);
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--color-bg-dark);
            background: linear-gradient(90deg, var(--color-gold), var(--color-white));
            padding: 5px 10px;
            border-radius: 5px;
            border: 1px solid var(--color-gold);
        }

        #drawConfirmBtn {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            font-size: 1.2rem;
            padding: 15px 40px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
            background: rgba(212, 168, 83, 0.2);
            backdrop-filter: blur(10px);
        }

        #drawConfirmBtn.visible {
            opacity: 1;
            pointer-events: auto;
        }

        /* Drawn Cards Area */
        #drawn-area {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 40;
        }

        .drawn-card-mini {
            width: 80px;
            height: 126px;
            background: #fff;
            border-radius: 6px;
            border: 1px solid var(--color-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            text-align: center;
            color: #1a0a2e;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            animation: popIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 5px;
            position: relative;
            overflow: hidden;
        }
        
        .drawn-card-mini img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.3;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Spread Layout Container */
        #spread-layout {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90vw;
            max-width: 800px;
            height: 55vh;
            margin-top: -30px;
            z-index: 10;
            pointer-events: none;
        }

        .layout-card-slot {
            position: absolute;
            width: 100px;
            height: 157px; /* Card ratio ~1:1.57 */
            border: 2px dashed rgba(212, 168, 83, 0.3);
            border-radius: 8px;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(212, 168, 83, 0.6);
            font-size: 0.8rem;
            text-align: center;
        }

        .drawn-card-final {
            position: absolute;
            width: 100px;
            height: 157px;
            transform-origin: center center;
            transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            border-radius: 8px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6), 0 0 20px rgba(212, 168, 83, 0.2);
            background: #fff;
            border: 2px solid transparent;
            background-image: linear-gradient(#fff, #fff), linear-gradient(135deg, var(--color-gold), var(--color-white));
            background-origin: border-box;
            background-clip: padding-box, border-box;
            z-index: 35;
            transform-style: preserve-3d;
        }

        .drawn-card-final::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(212,168,83,0.2), rgba(240,230,255,0.1));
            pointer-events: none;
            transition: var(--transition-smooth);
            border-radius: 7px;
        }
        
        .drawn-card-final:hover::after {
            background: linear-gradient(135deg, rgba(212,168,83,0.4), rgba(240,230,255,0.2));
        }

        .drawn-card-final img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 7px;
        }

        .drawn-card-final .overlay-label {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            background: rgba(30, 16, 64, 0.8);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: var(--color-gold);
            border: 1px solid var(--color-gold);
        }

        .scan-effect {
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(212, 168, 83, 0.4), transparent);
            transform: skewX(-20deg);
            z-index: 100;
            animation: scanMove 2s ease-in-out forwards;
            pointer-events: none;
            display: none;
        }

        @keyframes scanMove {
            0% { left: -100%; }
            100% { left: 200%; }
        }

        /* Mobile Adaptation */
        @media (max-width: 768px) {
            h1.main-title {
                font-size: 1.8rem;
                margin-top: 1rem;
            }
            .spread-card {
                width: 90vw;
                max-width: 320px;
                padding: 15px;
            }
            .fancy-input {
                font-size: 1.2rem;
                max-width: 90vw;
            }
            .number-input {
                width: 45px !important;
                height: 45px;
                max-width: 45px;
                font-size: 0.9rem;
            }
            #settingsPanel {
                width: 260px;
                right: -280px;
            }
            #settingsBtn {
                top: 15px;
                right: 15px;
                font-size: 20px;
            }
            #musicBtn {
                bottom: 15px;
                right: 15px;
                width: 36px;
                height: 36px;
                font-size: 16px;
            }
            #spread-layout {
                top: 45%;
                height: 65vh;
            }
            .layout-card-slot, .drawn-card-final {
                width: 16vw;
                height: calc(16vw * 1.57);
                max-width: 70px;
                max-height: 110px;
                font-size: 0.6rem;
            }
            .fan-card {
                width: 80px;
                height: 125px;
                margin-left: -40px;
                margin-top: -125px;
            }
            #fan-container {
                top: 96%;
            }
            .drawn-card-final .overlay-label {
                font-size: 0.65rem;
                padding: 2px 4px;
                bottom: -20px;
            }
            .inputs-container {
                gap: 10px;
            }
            #screen-result .glass-panel {
                padding: 20px 15px;
            }
            .result-scroll-area {
                max-height: 75vh;
            }
            #preloadScreen .main-title {
                font-size: 1.8rem !important;
            }
        }

        /* Screens */
        .screen {
            position: absolute;
            top: 100px;
            left: 0;
            width: 100%;
            height: calc(100% - 100px);
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
            overflow-y: auto;
            overflow-x: hidden;
            padding-bottom: 60px; /* Leave space at bottom for mobile */
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE and Edge */
        }
        
        .screen::-webkit-scrollbar {
            display: none; /* Chrome, Safari and Opera */
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Result Screen & DeepSeek API Markdown Styles */
        #screen-result .glass-panel {

            function handleLoad() {
                loadedCount++;
                updateProgress();
            }
            
            function handleError() {
                loadedCount++;
                hasError = true;
                updateProgress();
            }

            imagePaths.forEach(src => {
                const img = new Image();
                img.onload = handleLoad;
                img.onerror = handleError;

            audio.onerror = handleError;

        const STAR_COLORS = ['#d4a853', '#f0e6ff', 'rgba(212, 168, 83, 0.8)', 'rgba(240, 230, 255, 0.8)'];

        function resizeCanvas() {
            canvas.width = window.innerWidth;

        class Particle {
            constructor(layer) {
                this.layer = layer; // 'near' or 'far'
                this.reset(true);
            }

            reset(initial = false) {
                this.x = Math.random() * canvas.width;
                this.y = initial ? Math.random() * canvas.height : canvas.height + 10;
                
                if (this.layer === 'near') {
                    this.size = Math.random() * 2 + 1.5; // 1.5 - 3.5
                    this.baseAlpha = Math.random() * 0.5 + 0.5; // 0.5 - 1.0
                    this.speedY = Math.random() * 0.6 + 0.3; // 0.3 - 0.9
                } else {
                    this.size = Math.random() * 1.5 + 0.5; // 0.5 - 2.0
                    this.baseAlpha = Math.random() * 0.3 + 0.1; // 0.1 - 0.4
                    this.speedY = Math.random() * 0.2 + 0.1; // 0.1 - 0.3
                }
                
                this.color = STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)];
                this.period = Math.random() * 4000 + 2000; // 2-6 seconds
                this.timeOffset = Math.random() * Math.PI * 2;
                this.glow = this.layer === 'near' && Math.random() < 0.4;
                this.isGolden = this.color === '#d4a853' || this.color === 'rgba(212, 168, 83, 0.8)';
            }

            update(time) {
                this.y -= this.speedY;
                if (this.y < -10) {
                    this.reset();
                }
                
                // Mouse interaction
                const dx = mouseX - this.x;
                const dy = mouseY - this.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 120) {
                    this.x += dx * 0.015;
                    this.y += dy * 0.015;
                    if (this.isGolden) this.glow = true;
                } else {
                    // Natural horizontal drift
                    this.x += Math.sin(time / 2000 + this.timeOffset) * 0.15;
                }

                // Sine wave opacity
                const wave = Math.sin(time / this.period * Math.PI * 2 + this.timeOffset);
                this.alpha = this.baseAlpha + wave * (this.layer === 'near' ? 0.3 : 0.1);
                if (this.alpha < 0) this.alpha = 0;
                if (this.alpha > 1) this.alpha = 1;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                
                if (this.glow) {
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = this.color;
                }
                
                ctx.fill();
                ctx.restore();
            }
        }
        
        class Meteor {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width * 1.5;
                this.y = -100;
                this.speedX = -(Math.random() * 2 + 2);
                this.speedY = Math.random() * 2 + 2;
                this.length = Math.random() * 80 + 40;
                this.opacity = 0;
                this.state = 'waiting';
                this.waitTime = Math.random() * 5000 + 2000;
                this.lastTime = performance.now();
            }
            update(time) {
                if (this.state === 'waiting') {
                    if (time - this.lastTime > this.waitTime) {
                        this.state = 'falling';
                        this.lastTime = time;
                    }
                } else if (this.state === 'falling') {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    this.opacity = Math.min(1, this.opacity + 0.05);
                    if (this.x < -200 || this.y > canvas.height + 200) {
                        this.reset();
                        this.lastTime = time;
                    }
                }
            }
            draw(ctx) {
                if (this.state !== 'falling') return;
                ctx.save();
                ctx.globalAlpha = this.opacity;
                const grad = ctx.createLinearGradient(this.x, this.y, this.x - this.speedX * 10, this.y - this.speedY * 10);
                grad.addColorStop(0, 'rgba(212, 168, 83, 1)');
                grad.addColorStop(1, 'rgba(212, 168, 83, 0)');
                
                ctx.beginPath();
                ctx.strokeStyle = grad;
                ctx.lineWidth = 2;
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x - this.speedX * 10, this.y - this.speedY * 10);
                ctx.stroke();
                
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#d4a853';
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function initParticles() {
            particles = [];

            for (let i = 0; i < count; i++) {

        function initMysticSymbols() {
            const container = document.getElementById('mysticSymbols');
            if (!container) return;
            container.innerHTML = '';
            const symbols = ['☾', '☽', '☼', '✧', '⚝'];
            const count = 15;
            const minDist = 180;
            mysticSymbolsData = [];
            const placed = [];
            for (let i = 0; i < count; i++) {
                const el = document.createElement('div');
                el.className = 'mystic-symbol';
                el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                const size = Math.random() * 2 + 1;
                el.style.fontSize = `${size}rem`;
                container.appendChild(el);
                
                const vw = window.innerWidth;
                const vh = window.innerHeight;
                
                let px, py;
                let attempts = 0;
                const maxAttempts = 200;
                do {
                    px = Math.random() * (vw - 80) + 40;
                    py = Math.random() * (vh - 80) + 40;
                    attempts++;
                } while (attempts < maxAttempts && placed.some(p => {
                    const dx = p.x - px;
                    const dy = p.y - py;
                    return Math.sqrt(dx * dx + dy * dy) < minDist;
                }));
                placed.push({ x: px, y: py });
                
                mysticSymbolsData.push({
                    el: el,
                    x: px,
                    y: py,
                    vx: (Math.random() - 0.5) * 0.25,
                    vy: (Math.random() - 0.5) * 0.25,
                    rotation: Math.random() * 360,
                    rotationSpeed: (Math.random() - 0.5) * 0.04,
                    swayPhase: Math.random() * Math.PI * 2,
                    swaySpeed: Math.random() * 0.003 + 0.002,
                    swayAmp: Math.random() * 3 + 1
                });
            }
        }

        let mysticSymbolsData = [];

        function animateMysticSymbols(time) {
            if (!mysticSymbolsData.length) return;
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            
            mysticSymbolsData.forEach(s => {
                s.x += s.vx;
                s.y += s.vy;
                s.rotation += s.rotationSpeed;
                
                const swayX = Math.sin(time * s.swaySpeed + s.swayPhase) * s.swayAmp;
                const swayY = Math.cos(time * s.swaySpeed * 0.7 + s.swayPhase + 1) * s.swayAmp * 0.8;
                
                if (s.x < -40) s.x = vw + 30;
                if (s.x > vw + 40) s.x = -30;
                if (s.y < -40) s.y = vh + 30;
                if (s.y > vh + 40) s.y = -30;
                
                s.el.style.transform = `translate(${s.x}px, ${s.y}px) translate(${swayX}px, ${swayY}px) rotate(${s.rotation}deg)`;
            });
        }

        function drawConnections() {
            ctx.lineWidth = 0.5;
            for (let i = 0; i < particles.length; i++) {
                if (particles[i].layer === 'far') continue; // only connect near particles to save performance
                for (let j = i + 1; j < particles.length; j++) {
                    if (particles[j].layer === 'far') continue;
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distSq = dx * dx + dy * dy;
                    if (distSq < 8100) { // 90 * 90
                        const dist = Math.sqrt(distSq);
                        const opacity = (1 - dist / 90) * 0.15;
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(240, 230, 255, ${opacity})`;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
        }
        
        function drawNebula(ctx, time) {
            const cx1 = canvas.width/2 + Math.sin(time/6000)*300;
            const cy1 = canvas.height/2 + Math.cos(time/5000)*200;
            const gradient1 = ctx.createRadialGradient(cx1, cy1, 0, cx1, cy1, canvas.width/1.5);
            gradient1.addColorStop(0, 'rgba(212, 168, 83, 0.06)');
            gradient1.addColorStop(1, 'rgba(30, 16, 64, 0)');
            
            ctx.fillStyle = gradient1;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const cx2 = canvas.width/3 + Math.cos(time/7000)*200;
            const cy2 = canvas.height/3 + Math.sin(time/4000)*300;
            const gradient2 = ctx.createRadialGradient(cx2, cy2, 0, cx2, cy2, canvas.width/2);
            gradient2.addColorStop(0, 'rgba(240, 230, 255, 0.03)');
            gradient2.addColorStop(1, 'rgba(30, 16, 64, 0)');
            
            ctx.fillStyle = gradient2;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function animateCanvas(time) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            drawNebula(ctx, time);
            
            particles.forEach(p => {
                p.update(time);
                p.draw(ctx);
            });
            
            drawConnections();
            
            meteors.forEach(m => {
                m.update(time);
                m.draw(ctx);
            });

            animateMysticSymbols(time);
            
            animationFrameId = requestAnimationFrame(animateCanvas);
        }

        // --- Utility: Shuffle Array ---
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startMeditationStep() {
            const screen = document.getElementById('screen-meditation');

            inputs.forEach((input, index) => {
                input.addEventListener('input', validateNumberInputs);

        function validateNumberInputs() {
            const inputs = document.querySelectorAll('.number-input');
            const errorEl = document.getElementById('inputError');
            const confirmBtn = document.getElementById('confirmNumberBtn');
            const values = [];
            let hasError = false;
            let errorMsg = '';

            inputs.forEach(input => input.classList.remove('error'));

            for (let input of inputs) {
                const num = parseInt(input.value, 10);
                if (input.value === '') {
                    values.push(null);
                    continue;
                }
                if (isNaN(num) || num < 1 || num > 78 || !Number.isInteger(num)) {
                    hasError = true;
                    errorMsg = '请输入 1-78 之间的整数';
                    input.classList.add('error');
                    values.push(null);
                } else {
                    values.push(num);
                }
            }

            const filledValues = values.filter(v => v !== null);
            const uniqueSet = new Set(filledValues);
            if (uniqueSet.size < filledValues.length) {
                hasError = true;
                errorMsg = '数字不可重复';
                inputs.forEach(input => {
                    const num = parseInt(input.value, 10);
                    if (!isNaN(num) && filledValues.filter(v => v === num).length > 1) {
                        input.classList.add('error');
                    }
                });
            }

            const requiredCount = AppState.selectedSpread.cardCount;
            const allFilled = filledValues.length === requiredCount;
            if (!allFilled && !hasError) {
                errorMsg = `请填写全部 ${requiredCount} 个数字`;
            }

            errorEl.textContent = errorMsg;
            confirmBtn.disabled = hasError || !allFilled;

            if (!hasError && allFilled) {
                AppState.meditationNumbers = [...filledValues];
            } else {
                AppState.meditationNumbers = [];
            }
        }

        function handleNumberSubmit() {

        // --- Fan Deck & Draw Implementation ---

        const SPREAD_POSITIONS = {

            ],
            celtic: [

                { x: '35%', y: '50%', rotate: 90 }, // 2阻碍 (横放)
                { x: '35%', y: '80%' }, // 3基础

                { x: '80%', y: '40%' }, // 9希望/恐惧
                { x: '80%', y: '20%' }  // 10结果
            ]
        };

        function initFanDeck() {
            N_VISIBLE = window.innerWidth < 768 ? 7 : 11;
            drawQueue = [...AppState.meditationNumbers];
            currentDrawIndex = 0;
            AppState.drawnCards = [];
            
            // Generate layout slots
            spreadLayout.innerHTML = '<div class="scan-effect" id="layoutScanEffect"></div>';
            const positions = SPREAD_POSITIONS[AppState.selectedSpreadKey];
            positions.forEach((pos, idx) => {
                const slot = document.createElement('div');
                slot.className = 'layout-card-slot';
                slot.style.left = pos.x;
                slot.style.top = pos.y;
                slot.innerHTML = AppState.selectedSpread.positions[idx];
                spreadLayout.appendChild(slot);
            });

            fanContainer.innerHTML = '';
            
            // Set initial offset far away so it "scrolls" to the first target
            scrollOffsetRef = (drawQueue[0] % 78) - 20; 
            scrollVelocity = 0;
            isDragging = false;
            isDrawing = false;
            
            for (let i = 0; i < N_VISIBLE; i++) {
                const card = document.createElement('div');
                card.className = 'fan-card';
                card.innerHTML = `
                    <div class="fan-card-inner">
                        <div class="fan-card-back"></div>
                        <div class="fan-card-front"></div>
                    </div>
                `;
                fanContainer.appendChild(card);
            }

            setTimeout(() => {
                fanContainer.classList.add('visible');
                // Start auto drawing sequence
                setTimeout(processNextDraw, 800);
            }, 100);

            if (!fanRafId) {
                fanRafId = requestAnimationFrame(updateFanDeck);
            }
        }

        function handlePointerDown(e) {
            if (isDrawing) return;
            isDragging = true;
            startX = e.clientX;
            scrollVelocity = 0;
        }

        function handlePointerMove(e) {
            if (!isDragging || isDrawing) return;
            const deltaX = e.clientX - startX;
            startX = e.clientX;
            
            // 40px approx 1 step
            const deltaOffset = -deltaX / 40;
            scrollOffsetRef += deltaOffset;
            scrollVelocity = deltaOffset * 60; // Approximate velocity per second (assuming 60fps)
        }

        function handlePointerUp() {
            if (isDragging) {
                isDragging = false;
            }
        }

        function updateFanDeck() {
            if (!fanContainer.classList.contains('visible') && !isDrawing) {
                fanRafId = requestAnimationFrame(updateFanDeck);
                return;
            }

            if (!isDragging && Math.abs(scrollVelocity) > 0.001) {
                scrollOffsetRef += scrollVelocity * (1/60);
                scrollVelocity *= 0.95;
                if (Math.abs(scrollVelocity) < 0.001) scrollVelocity = 0;
            }

            // Snap to nearest integer if velocity is very low
            if (!isDragging && Math.abs(scrollVelocity) < 0.05) {
                const nearest = Math.round(scrollOffsetRef);
                scrollOffsetRef += (nearest - scrollOffsetRef) * 0.1;
            }

            scrollOffsetRef = ((scrollOffsetRef % 78) + 78) % 78;

            const isMobile = window.innerWidth < 768;
            const ARC_RADIUS = isMobile ? 260 : 520;
            const ARC_LIFT = ARC_RADIUS;
            const baseScale = isMobile ? 0.8 : 1.0;

            const cards = fanContainer.querySelectorAll('.fan-card');
            
            cards.forEach((card, i) => {
                const theta_i_deg = (i - Math.floor(N_VISIBLE / 2)) * ARC_STEP_DEG;
                const theta_deg = theta_i_deg + (scrollOffsetRef % 1) * ARC_STEP_DEG; // Wait, scrollOffsetRef determines the center card
                
                // Let center index be Math.round(scrollOffsetRef)
                // The actual offset in steps for card i is:
                const offsetSteps = (i - Math.floor(N_VISIBLE / 2)) - (scrollOffsetRef % 1);
                const actual_theta_deg = offsetSteps * ARC_STEP_DEG;
                const theta_rad = actual_theta_deg * (Math.PI / 180);

                const x = Math.sin(theta_rad) * ARC_RADIUS;
                const y = ARC_LIFT * (1 - Math.cos(theta_rad));

                // Scale and opacity based on actual_theta_deg
                const cosRatio = Math.cos(actual_theta_deg * Math.PI / 90); // 90 deg range
                let scale = 0.65 + 0.35 * Math.max(0, cosRatio);
                scale *= baseScale;
                
                let opacity = 0.35 + 0.65 * Math.max(0, cosRatio);
                
                // Z-index
                const zIndex = 50 - Math.abs(Math.round(offsetSteps)) * 3;

                card.style.transform = `translate(${x}px, -${y}px) rotate(${actual_theta_deg}deg) scale(${scale})`;
                card.style.opacity = opacity;
                card.style.zIndex = zIndex;
                
                // Assign card id to front
                if (!card.classList.contains('flipped')) {
                    const cardIndex = Math.floor(((Math.round(scrollOffsetRef) + i - Math.floor(N_VISIBLE/2)) % 78 + 78) % 78);
                    card.dataset.cardIndex = cardIndex;
                }
            });

            fanRafId = requestAnimationFrame(updateFanDeck);
        }

        // --- Step 7: Draw Flow ---
        function processNextDraw() {
            if (currentDrawIndex >= drawQueue.length) {
                // All cards drawn
                fanContainer.classList.remove('visible');
                const scanEffect = document.getElementById('layoutScanEffect');
                if(scanEffect) scanEffect.style.display = 'block';
                setTimeout(startResultStep, 2500);
                return;
            }

            isDrawing = true;
            const targetOffset = drawQueue[currentDrawIndex] % 78;
            
            // Auto scroll to target (smooth ease out)
            let startOffset = scrollOffsetRef;
            let diff = targetOffset - (startOffset % 78);
            if (diff < -39) diff += 78;
            if (diff > 39) diff -= 78;
            
            const totalDiff = diff;
            const duration = 800; // ms
            const startTime = performance.now();

            function easeOutCubic(x) {
                return 1 - Math.pow(1 - x, 3);
            }

            function animateScroll(time) {
                const elapsed = time - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const ease = easeOutCubic(progress);
                
                scrollOffsetRef = startOffset + totalDiff * ease;
                
                if (progress < 1) {
                    requestAnimationFrame(animateScroll);
                } else {
                    scrollOffsetRef = targetOffset;
                    // Start extraction sequence
                    setTimeout(extractCenterCard, 200);
                }
            }
            requestAnimationFrame(animateScroll);
        }

        function extractCenterCard() {
            const cards = fanContainer.querySelectorAll('.fan-card');
            const centerCard = cards[Math.floor(N_VISIBLE / 2)];
            
            // Map the user's input number (1-78) to an index (0-77) in the shuffled deck
            const inputNumber = drawQueue[currentDrawIndex];
            const deckIndex = inputNumber - 1; 
            const tarotData = AppState.shuffledDeck[deckIndex];
            
            const front = centerCard.querySelector('.fan-card-front');
            const isReversed = Math.random() > 0.5;
            
            front.innerHTML = `
                <img src="graph/${tarotData.imgName}" alt="${tarotData.name}" onerror="this.style.display='none'">
                <div class="card-name-overlay">${tarotData.name}</div>
            `;

            // Glow and slight scale up
            centerCard.style.transition = 'all 0.3s ease';
            centerCard.style.boxShadow = '0 0 30px 10px rgba(212, 168, 83, 0.8)';
            const currentTransform = centerCard.style.transform;
            centerCard.style.transform = currentTransform + ' scale(1.05)';

            setTimeout(() => {
                // Remove glow, start flip
                centerCard.style.boxShadow = '';
                centerCard.style.transform = currentTransform;
                centerCard.classList.add('flipped');
                
                const inner = centerCard.querySelector('.fan-card-inner');
                if (isReversed) {
                    inner.style.transform = 'rotateY(180deg) rotateZ(180deg)';
                } else {
                    inner.style.transform = 'rotateY(180deg)';
                }

                // Wait for flip to complete
                setTimeout(() => {
                    flyCardToLayout(centerCard, tarotData, isReversed);
                }, 800);
            }, 400);
        }

        function flyCardToLayout(sourceCard, tarotData, isReversed) {
            // Get position of source card
            const rect = sourceCard.getBoundingClientRect();
            const positions = SPREAD_POSITIONS[AppState.selectedSpreadKey];
            const targetPos = positions[currentDrawIndex];

            // Create flying card
            const flyCard = document.createElement('div');
            flyCard.className = 'drawn-card-final';
            flyCard.style.left = rect.left + rect.width / 2 + 'px';
            flyCard.style.top = rect.top + rect.height / 2 + 'px';
            flyCard.style.transform = `translate(-50%, -50%) ${isReversed ? 'rotate(180deg)' : 'rotate(0deg)'}`;
            
            flyCard.innerHTML = `
                <img src="graph/${tarotData.imgName}" onerror="this.style.display='none'">
                <div class="overlay-label" style="${isReversed ? 'transform: translateX(-50%) rotate(180deg); bottom: auto; top: -25px;' : ''}">${tarotData.name}${isReversed ? ' (逆)' : ''}</div>
            `;
            
            document.body.appendChild(flyCard);

            // Record
            AppState.drawnCards.push({
                card: tarotData,
                isReversed: isReversed,
                position: AppState.selectedSpread.positions[currentDrawIndex]
            });

            // Hide original card temporarily to avoid visual dup
            sourceCard.style.opacity = '0';

            // Trigger reflow
            flyCard.offsetHeight;

            // Fly to target
            flyCard.style.left = targetPos.x;
            flyCard.style.top = targetPos.y;
            if (targetPos.rotate) {
                flyCard.style.transform = `translate(-50%, -50%) rotate(${targetPos.rotate + (isReversed ? 180 : 0)}deg)`;
            } else {
                flyCard.style.transform = `translate(-50%, -50%) ${isReversed ? 'rotate(180deg)' : 'rotate(0deg)'}`;
            }

            setTimeout(() => {
                // Fly done, attach to layout container
                spreadLayout.appendChild(flyCard);
                // Adjust coords to be relative to container
                flyCard.style.left = targetPos.x;
                flyCard.style.top = targetPos.y;
                
                currentDrawIndex++;
                
                // Hide deck, advance offset, and prepare next
                if (currentDrawIndex < drawQueue.length) {
                    fanContainer.classList.remove('visible');
                    setTimeout(() => {
                        scrollOffsetRef += 17; // advance offset
                        sourceCard.classList.remove('flipped');
                        const inner = sourceCard.querySelector('.fan-card-inner');
                        inner.style.transform = ''; // Reset the inner transform
                        sourceCard.style.opacity = '';
                        sourceCard.style.transition = '';
                        fanContainer.classList.add('visible');
                        
                        setTimeout(processNextDraw, 600);
                    }, 600);
                } else {
                    processNextDraw(); // will trigger the end
                }

            }, 800);
        }

        // --- Step 8: Result & DeepSeek API ---
        function startResultStep() {
            switchScreen('screen-result');
            const screen = document.getElementById('screen-result');
            
            // Generate result layout
            let resultHTML = `
                <div class="glass-panel" style="width: 100%; max-width: 800px; padding: 30px;">
                    <div class="corner-symbol top-left">✧</div>
                    <div class="corner-symbol top-right">✧</div>
                    <div class="corner-symbol bottom-left">✧</div>
                    <div class="corner-symbol bottom-right">✧</div>
                    <div class="result-scroll-area">
                        <h2 class="spread-title" style="text-align: center; font-size: 2rem; margin-bottom: 20px;">解读结果</h2>
                        <div id="apiContent" style="line-height: 1.8; font-size: 1.1rem; white-space: pre-wrap;"></div>
                        <div id="loadingIndicator" style="text-align: center; margin-top: 20px;">
                            <div style="font-size: 2rem; animation: spin 2s linear infinite;">✨</div>
                            <p style="margin-top: 10px; color: var(--color-gold);">正在连接宇宙能量...</p>
                        </div>
                        <button class="btn" id="restartBtn" style="display: none; margin: 30px auto 0;">重新占卜</button>
                    </div>
                </div>
                <style>
                    @keyframes spin { 100% { transform: rotate(360deg); } }
                </style>
            `;
            screen.innerHTML = resultHTML;

            document.getElementById('restartBtn').addEventListener('click', () => {
                location.reload();
            });

            callDeepSeekAPI();
        }

        async function callDeepSeekAPI() {
            const apiContent = document.getElementById('apiContent');
            const loadingIndicator = document.getElementById('loadingIndicator');
            const restartBtn = document.getElementById('restartBtn');

            if (!AppSettings.apiKey) {
                loadingIndicator.style.display = 'none';
                apiContent.innerHTML = `<span style="color: #ff6b6b;">错误：未设置 DeepSeek API Key。请在 index.html 代码中的 DEEPSEEK_API_KEY 处填入您的 API Key。</span>`;
                restartBtn.style.display = 'block';
                return;
            }

            const drawnText = AppState.drawnCards.map((c, i) => {
                return `[${c.position}] ${c.card.name} (${c.isReversed ? '逆位' : '正位'})`;
            }).join('\n');

            const systemPrompt = "你是一位资深塔罗牌解读师，拥有20年占卜经验。你精通韦特塔罗、托特塔罗等多种体系。你的解读风格既专业又富有诗意，能够将牌面符号与提问者的生活情境巧妙连接。你总是先解读每张牌在特定牌位中的含义，然后综合分析整个牌阵的能量流动，最后给出温暖而有力的建议。使用流畅优美的中文。";
            
            const userPrompt = `请为我解读以下塔罗牌阵：
牌阵类型：${AppState.selectedSpread.name}
各牌位含义：${AppState.selectedSpread.positions.join(', ')}
用户问题：${AppState.question || '无具体问题，寻求普遍指引'}
抽取结果：
${drawnText}
请给出详细解读，包括每张牌在牌位中的具体含义、牌阵整体能量分析、以及给用户的建议。`;

            try {
                const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${AppSettings.apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: userPrompt }
                        ],
                        temperature: 0.8,
                        max_tokens: 2048,
                        stream: true
                    })
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(`API 错误 (${response.status}): ${errText}`);
                }

                loadingIndicator.style.display = 'none';
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let done = false;

                let fullText = '';
                
                function formatAPIContent(text) {
                    let html = text.replace(/\n/g, '<br>');
                    // Bold to keyword tags
                    html = html.replace(/\*\*(.*?)\*\*/g, '<span class="keyword-tag">$1</span>');
                    // ### Headings to dividers
                    html = html.replace(/### (.*?)<br>/g, '<div class="api-divider"></div><h3 class="result-title-grad" style="text-align:center; margin-bottom:10px; font-size:1.4rem;">$1</h3>');
                    // ## Headings
                    html = html.replace(/## (.*?)<br>/g, '<div class="api-divider"></div><h2 class="result-title-grad" style="text-align:center; margin-bottom:12px; font-size:1.6rem;">$1</h2>');
                    // # Headings
                    html = html.replace(/# (.*?)<br>/g, '<div class="api-divider"></div><h1 class="result-title-grad" style="text-align:center; margin-bottom:15px; font-size:1.8rem;">$1</h1>');
                    return html;
                }

                while (!done) {
                    const { value, done: readerDone } = await reader.read();
                    done = readerDone;
                    if (value) {
                        const chunk = decoder.decode(value, { stream: true });
                        const lines = chunk.split('\n').filter(line => line.trim() !== '');
                        for (const line of lines) {
                            if (line === 'data: [DONE]') {
                                done = true;
                                break;
                            }
                            if (line.startsWith('data: ')) {
                                try {
                                    const data = JSON.parse(line.slice(6));
                                    const delta = data.choices[0].delta.content;
                                    if (delta) {
                                        fullText += delta;
                                        apiContent.innerHTML = formatAPIContent(fullText);
                                        // Scroll to bottom
                                        apiContent.parentElement.scrollTop = apiContent.parentElement.scrollHeight;
                                    }
                                } catch (e) {
                                    console.error('Error parsing stream data:', e, line);
                                }
                            }
                        }
                    }
                }
            } catch (error) {
                loadingIndicator.style.display = 'none';
                apiContent.innerHTML += `<br><br><span style="color: #ff6b6b;">发生错误：${error.message}</span>`;
            } finally {
                restartBtn.style.display = 'block';
            }
        }
    </script>
</body>
