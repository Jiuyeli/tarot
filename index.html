<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Tarot Divination ✨</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Starry Background -->
    <canvas id="starCanvas"></canvas>

    <!-- Mystic Symbols Background -->
    <div id="mysticSymbols"></div>

    <!-- Preload Screen -->
    <div id="preloadScreen" class="screen active" style="z-index: 1000; background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); top: 0; height: 100%; justify-content: center; opacity: 1; pointer-events: auto;">
        <h1 class="main-title" style="opacity: 1; transform: none; animation: none; margin-bottom: 2rem;">✨ Tarot Divination ✨</h1>
        <div style="width: 80%; max-width: 300px; height: 4px; background: rgba(212, 168, 83, 0.2); border-radius: 2px; overflow: hidden; position: relative;">
            <div id="preloadBar" style="width: 0%; height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--color-gold), var(--color-gold-light)); transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);"></div>
        </div>
        <div id="preloadText" style="margin-top: 1rem; color: var(--color-gold); font-size: 0.9rem;">Connecting to the Universe... 0%</div>
        <button id="preloadStartBtn" class="btn" style="margin-top: 2rem; opacity: 0; pointer-events: none; transform: translateY(20px); transition: all 0.5s ease;">Enter</button>
    </div>

    <div id="app">
        <h1 class="main-title">✨ Tarot Divination ✨</h1>

        <!-- Settings Button -->
        <button id="settingsBtn" title="设置">⚙️</button>

        <!-- Author Button -->
        <button id="authorBtn" title="作者说">✉️</button>

        <!-- Settings Panel -->
        <div id="settingsPanel">
            <h2 style="color: var(--color-gold); font-family: var(--font-title); margin-bottom: 10px;">设置</h2>
            <div class="setting-group">
                <label>音乐音量</label>
                <input type="range" id="volumeInput" min="0" max="100" value="40">
            </div>
            <div class="setting-group">
                <label>粒子密度</label>
                <input type="range" id="particlesInput" min="100" max="400" value="250">
            </div>
            <div class="setting-group">
                <label>音效</label>
                <button id="sfxToggleBtn" class="btn" style="font-size: 0.8rem; padding: 5px 15px;">🔊 开启</button>
            </div>
            <button class="btn" id="clearHistoryBtn" style="margin-top: auto;">清空历史记录</button>
        </div>

        <!-- Author Panel -->
        <div id="authorPanel">
            <h2 style="color: var(--color-gold); font-family: var(--font-title); margin-bottom: 16px;">✉️ 作者说</h2>
            <!-- Rendered dynamically from author-messages.js -->
        </div>

        <!-- Music Button -->
        <button id="musicBtn" title="播放/暂停音乐">
            <span class="icon">🎵</span>
            <div class="playing-waves">
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>
            </div>
        </button>
        <audio id="bgMusic" src="first_light_particles_0.wav" loop preload="auto"></audio>

        <!-- Screens -->
        <!-- Step 1: Spread Selection -->
        <div id="screen-spread" class="screen">
            <!-- Spread cards will go here -->
        </div>

        <!-- Step 2-3: Question & Meditation -->
        <div id="screen-meditation" class="screen">
            <!-- Question input and meditation prompt will go here -->
        </div>

        <!-- Step 4-5: Fan Deck & Draw -->
        <div id="screen-draw" class="screen">
            <div id="spread-layout">
                <div class="scan-effect" id="layoutScanEffect"></div>
            </div>
            <div id="fan-container">
                <!-- 11 fan cards will be generated here -->
            </div>
        </div>

        <!-- Step 6: Reading Result -->
        <div id="screen-result" class="screen">
            <!-- DeepSeek result will go here -->
        </div>

    </div>

    <!-- Load order: data → background → app logic -->
    <script src="tarot-data.js"></script>
    <script src="author-messages.js"></script>
    <script src="starry-background.js"></script>
    <script src="app.js"></script>

</body>
</html>
